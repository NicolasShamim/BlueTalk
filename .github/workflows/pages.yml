name: Deploy site

on:
  push:
    branches: [claude/tiktok-clothing-channel-mytn9g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement asks GitHub to create the Pages site if it does not
      # exist. The Actions token is not allowed to do that — creating a
      # Pages site needs repo-admin rights — so Pages has to be switched
      # on once by hand:
      #
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # After that this step finds the existing site and the deploy runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Ship only what the site serves — the brand docs stay in the repo
      # but are not published.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js shop.js config.js _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
