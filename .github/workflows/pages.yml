name: Deploy site

on:
  push:
    branches: [claude/tiktok-clothing-channel-mytn9g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement asks GitHub to create the Pages site if it does not
      # exist. The Actions token is not allowed to do that — creating a
      # Pages site needs repo-admin rights — so Pages has to be switched
      # on once by hand:
      #
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # After that this step finds the existing site and the deploy runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Ship only what the site serves — the brand docs stay in the repo
      # but are not published.
      - name: Stage site
        env:
          FW_TOKEN:  ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
          FW_DOMAIN: ${{ secrets.FOURTHWALL_SHOP_DOMAIN }}
        run: |
          mkdir -p _site
          cp index.html privacy.html styles.css script.js shop.js config.js favicon.svg og.png _site/
          mkdir -p _site/assets && cp assets/* _site/assets/
          [ -f CNAME ] && cp CNAME _site/ || true

          # Inject the shop credentials that are deliberately kept out of
          # the repository. Both end up public in the served page, which is
          # how a static storefront works — the storefront token is
          # read-only and scoped to the public catalog. If a secret is
          # unset the substitution is a no-op and the site just shows the
          # pieces as unreleased.
          sed -i "s|storefrontToken: ''|storefrontToken: '${FW_TOKEN}'|" _site/config.js
          sed -i "s|shopDomain:      ''|shopDomain:      '${FW_DOMAIN}'|" _site/config.js

          echo "token set: $([ -n "$FW_TOKEN" ] && echo yes || echo no)"
          echo "domain set: $([ -n "$FW_DOMAIN" ] && echo yes || echo no)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
